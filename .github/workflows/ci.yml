name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run check
      - name: Type-check
        run: bun run typecheck
      - name: Tests, with what Hermes has
        run: bun test
      - name: Tests, with the full Intl
        run: bun test
        env:
          FULL_INTL: "1"
      - name: Expo Doctor
        run: bun run doctor
